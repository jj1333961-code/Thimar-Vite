<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F5C4A" />
    <meta name="description" content="ثمار — متابعة حفظ القرآن الكريم والتسميع والمهمات والتحدي." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ثمار" />
    <title>ثمار — حفظ القرآن الكريم</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F5C4A'/%3E%3Cpath d='M32 15c7 5 10 11 10 17a10 10 0 0 1-20 0c0-6 3-12 10-17z' fill='none' stroke='%23D8B978' stroke-width='3'/%3E%3Cpath d='M32 28v18' stroke='%23D8B978' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      لا تجعل خطوط Google تحجب أول رسم: في الشبكات البطيئة أو التي تحجب
      fonts.googleapis.com كان طلب CSS المزامن يترك WebView على شاشة بيضاء
      حتى انتهاء المهلة. التحميل الآن غير حاجب، وتُطبَّق الخطوط فور وصولها.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("thimar.settings.v1");
          var theme = "light";
          if (raw) {
            var s = JSON.parse(raw);
            if (s && typeof s.theme === "string") theme = s.theme;
          }
          var resolved = theme;
          if (theme === "auto") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (resolved === "sepia") resolved = "light";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: #FAF7F1">
    <div id="root"></div>
    <!--
      شبكة أمان محلية مستقلة عن React وFirebase وSupabase: إذا لم تُركَّب
      الواجهة خلال ١٢ ثانية، أو وقع خطأ غير معالَج، تظهر رسالة عربية مع زر
      إعادة المحاولة بدل الشاشة البيضاء. لا تظهر إطلاقًا عند نجاح الإقلاع.
    -->
    <div
      id="boot-fallback"
      role="alert"
      style="display: none; position: fixed; inset: 0; z-index: 2147483647; background: #FAF7F1; color: #1F2937; font-family: Tajawal, system-ui, sans-serif; padding: 40px 28px; text-align: center; direction: rtl"
    >
      <div style="max-width: 420px; margin: 15vh auto 0">
        <div style="font-size: 22px; font-weight: 700; color: #2F5C4A; margin-bottom: 12px">تعذّر بدء واجهة ثمار</div>
        <p id="boot-fallback-message" style="font-size: 16px; line-height: 1.9; margin: 0 0 24px">
          لم تكتمل تهيئة الواجهة. تحقّق من اتصال الإنترنت ثم أعد المحاولة. بياناتك المحفوظة لم تُمسّ.
        </p>
        <button
          id="boot-fallback-repair"
          type="button"
          style="padding: 12px 28px; font-size: 16px; font-family: inherit; border: 0; border-radius: 12px; background: #2F5C4A; color: #fff; font-weight: 700; margin: 4px"
        >
          إصلاح وتحديث النسخة
        </button>
        <button
          type="button"
          onclick="window.location.reload()"
          style="padding: 12px 28px; font-size: 16px; font-family: inherit; border: 1px solid #2F5C4A; border-radius: 12px; background: transparent; color: #2F5C4A; font-weight: 700; margin: 4px"
        >
          إعادة المحاولة
        </button>
      </div>
    </div>
    <script>
      (function () {
        var fallback = document.getElementById("boot-fallback");
        var message = document.getElementById("boot-fallback-message");
        var repair = document.getElementById("boot-fallback-repair");
        var root = document.getElementById("root");
        var settled = false;
        var shown = false;
        function show(text) {
          if (settled || !fallback) return;
          if (root && root.childElementCount > 0) return;
          if (text && message) message.textContent = text;
          fallback.style.display = "block";
          shown = true;
        }
        function clear() {
          settled = true;
          if (fallback) fallback.style.display = "none";
        }
        /*
         * إصلاح فعلي: يزيل عامل الخدمة وكل الكاش ثم يعيد التحميل. هذا ما يعالج
         * الحالة الأشيع لظهور صفحة بيضاء: صفحة index قديمة محفوظة في الكاش
         * تشير إلى حزمة JS تغيّر اسمها بعد النشر.
         */
        function repairAndReload() {
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(
                    regs.map(function (reg) {
                      return reg.unregister();
                    }),
                  );
                }),
              );
            }
          } catch (e) {}
          try {
            if (window.caches && window.caches.keys) {
              jobs.push(
                window.caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (key) {
                      return window.caches.delete(key);
                    }),
                  );
                }),
              );
            }
          } catch (e) {}
          Promise.all(jobs).catch(function () {}).then(function () {
            var next = new URL(window.location.href);
            next.searchParams.set("v", String(Date.now()));
            window.location.replace(next.toString());
          });
        }
        if (repair) repair.addEventListener("click", repairAndReload);

        function recover(reason) {
          /*
           * إذا فشل تحميل الحزمة ونحن متصلون، فالمقصود دائمًا صفحة قديمة في
           * الكاش أو نسخة قديمة من عامل الخدمة: ننظّف تلقائيًا مرة واحدة فقط
           * خلال دقيقة حتى لا ندخل في حلقة تحديث. في وضع عدم الاتصال لا نحذف
           * شيئًا، لأن الكاش هو ما يشغّل التطبيق دون إنترنت.
           */
          var online = navigator.onLine !== false;
          var key = "thimar.boot.recovery";
          var last = 0;
          try {
            last = Number(sessionStorage.getItem(key) || 0) || 0;
          } catch (e) {}
          if (online && Date.now() - last > 60000) {
            try {
              sessionStorage.setItem(key, String(Date.now()));
            } catch (e) {}
            show("تحديث الواجهة إلى أحدث نسخة…");
            repairAndReload();
            return;
          }
          show(reason);
        }

        /* أخطاء تحميل الموارد (سكربت/ستايل) لا تصل إلى window إلا في مرحلة الالتقاط. */
        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            var tag = target && target.tagName;
            if (tag === "SCRIPT" || tag === "LINK") {
              recover("تعذّر تحميل ملفات الواجهة. اضغط «إصلاح وتحديث النسخة» لإزالة النسخة القديمة من الكاش.");
              return;
            }
            if (event && event.message) {
              recover("حدث خطأ أثناء تحميل الواجهة. أعد المحاولة، وإن تكرّر فأبلغ الدعم مع سجل التشخيص.");
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", function () {
          show("تعذّر إكمال تهيئة بعض الخدمات. أعد المحاولة — بياناتك المحفوظة لم تُمسّ.");
        });
        window.setTimeout(function () {
          if (root && root.childElementCount > 0) clear();
          else show("تأخر تحميل الواجهة. تحقّق من الاتصال ثم أعد المحاولة. بياناتك المحفوظة لم تُمسّ.");
        }, 8000);
        if (root) {
          new MutationObserver(function () {
            if (root.childElementCount > 0) clear();
          }).observe(root, { childList: true });
        }
        window.__thimarBootShown = function () {
          return shown;
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx" id="thimar-entry"></script>
  </body>
</html>
