name: Regenerate dependency lockfile

on:
  push:
    branches: [security/remove-unneeded-overlay-permission]
    paths:
      - 'package.json'
      - '.github/workflows/regenerate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-unneeded-overlay-permission
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile from reviewed package versions
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install and security checks
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run test:android-security
          npm run typecheck
          npm run build:quran-search-index
          npm run build
      - name: Commit only the regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git add package-lock.json
          git commit -m "security(deps): regenerate lockfile for patched Vite"
          git push origin HEAD:security/remove-unneeded-overlay-permission
