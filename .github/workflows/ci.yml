name: Validate Thimar

on:
  push:
    branches:
      - main
      - "automation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test remembered-device opt-in
        run: npm run test:remember-device
      - name: TypeScript validation
        run: npm run typecheck
