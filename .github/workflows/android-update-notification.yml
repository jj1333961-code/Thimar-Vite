name: Android update release

on:
  push:
    branches: [main]
    paths:
      # دفع زيادة الإصدار هو إشارة "إصدار جديد جاهز". ملف الميتاداتا لم يعد مُشغِّلًا
      # كي لا يعيد الروبوت الذي ينشره البناء على نفسه.
      - 'packaging/android/app/build.gradle'
      - '.github/workflows/android-update-notification.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the APK and send update notifications (true) or build+verify only (false)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      previous_apk:
        description: 'Previous APK filename to delete from R2 (optional)'
        required: false
        default: ''
      approved:
        description: 'Explicit release approval (must be true to publish)'
        type: choice
        options: ['false', 'true']
        default: 'false'

concurrency:
  group: thimar-android-update-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # مهمة نشر الميتاداتا تدفع التزامًا يحمل [skip release] فلا يعاد البناء له.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.meta.outputs.apk_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      version_name: ${{ steps.meta.outputs.version_name }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      file_size: ${{ steps.meta.outputs.file_size }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          THIMAR_KEYSTORE_BASE64: ${{ secrets.THIMAR_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$THIMAR_KEYSTORE_BASE64" ]]; then
            echo "THIMAR_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$THIMAR_KEYSTORE_BASE64" | base64 --decode > /tmp/thimar-release.jks
          echo "THIMAR_KEYSTORE=/tmp/thimar-release.jks" >> $GITHUB_ENV
          echo "Keystore decoded (size: $(wc -c < /tmp/thimar-release.jks) bytes)"

      # الأصول المضمَّنة (واجهة + نماذج + runtime) تُبنى وقت الإصدار ولا تُحفظ في Git،
      # فلا بد من توليدها قبل البناء وإلا خرج APK بلا عمل دون اتصال.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Fetch offline Tilawa assets
        run: bash scripts/fetch-offline-assets.sh

      - name: Bundle assets into Android app
        run: bash scripts/bundle-android-assets.sh

      - name: Build release APK
        working-directory: packaging/android
        env:
          THIMAR_KEYSTORE: /tmp/thimar-release.jks
          THIMAR_KEYSTORE_PASSWORD: ${{ secrets.THIMAR_KEYSTORE_PASSWORD }}
          THIMAR_KEY_ALIAS: ${{ secrets.THIMAR_KEY_ALIAS }}
          THIMAR_KEY_PASSWORD: ${{ secrets.THIMAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        id: meta
        working-directory: packaging/android
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "APK not found at $APK_PATH" >&2
            exit 1
          fi
          # Package ID check
          if command -v aapt2 >/dev/null 2>&1; then
            PKG=$(aapt2 dump badging "$APK_PATH" | grep -o "package: name='[^']*'" | sed "s/package: name='//;s/'//")
            echo "Package: $PKG"
            if [[ "$PKG" != "app.thimar.quran" ]]; then
              echo "Wrong package ID: $PKG" >&2; exit 1
            fi
          fi
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK_PATH")
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "apk_name=thimar-${VERSION_NAME}-release.apk" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "file_size=$SIZE" >> $GITHUB_OUTPUT
          echo "APK: thimar-${VERSION_NAME}-release.apk, v${VERSION_NAME} (code ${VERSION_CODE}), ${SIZE} bytes, sha256=${SHA256}"
          # Copy to a known location
          cp "$APK_PATH" "/tmp/thimar-${VERSION_NAME}-release.apk"

      # كل ملف مضمَّن يُتحقق من بصمته داخل الـAPK نفسه قبل أي رفع.
      - name: Verify bundled assets inside APK
        working-directory: packaging/android
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, zipfile

          apk = "app/build/outputs/apk/release/app-release.apk"

          def fail(message):
              print(message, file=sys.stderr)
              sys.exit(1)

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())

              def require(path):
                  if path not in names:
                      fail(f"Missing bundled asset: {path}")
                  return z.read(path)

              # ١) هوية البناء: نرفض حزمة لا نعرف من أي التزام أُنتجت.
              try:
                  build = json.loads(require("assets/www/build.json"))
              except json.JSONDecodeError as error:
                  fail(f"Unreadable assets/www/build.json: {error}")
              commit = str(build.get("commit") or "")
              expected = os.environ.get("GITHUB_SHA", "").strip()
              if len(commit) < 7:
                  fail("assets/www/build.json carries no commit id")
              if expected and commit != expected:
                  fail(f"Bundled build commit {commit} does not match workflow commit {expected}")
              print("build.json:", json.dumps(build, ensure_ascii=False))

              # ٢) أصول أساسية بالمسار الذي تطلبه الواجهة بالضبط.
              for path in (
                  "assets/www/index.html",
                  "assets/www/sw.js",
                  "assets/www/manifest.webmanifest",
                  "assets/www/quran/pages.json",
                  "assets/www/quran/hafs/text.json",
                  "assets/www/quran/tajweed.json",
                  "assets/www/licenses/THIRD_PARTY_NOTICES.md",
                  "assets/offline/v1/manifest.json",
              ):
                  require(path)

              # ٢ب) نص المصحف المضمَّن: JSON صالح وكامل.
              try:
                  verses = json.loads(require("assets/www/quran/hafs/text.json"))
              except json.JSONDecodeError as error:
                  fail(f"Bundled quran/hafs/text.json is not valid JSON: {error}")
              if len(verses) < 6236:
                  fail(f"Bundled quran/hafs/text.json has {len(verses)} verses, expected 6236")
              print(f"Quran hafs text verified: {len(verses)} verses")

              # ٣) ملف .gz داخل assets مرفوض: aapt2 يفكّه ويسمّيه بلا .gz،
              # فيصبح اسم الأصل في الحزمة مخالفًا لما تطلبه الواجهة.
              if "assets/www/quran/hafs/text.json.gz" in names:
                  fail("assets/www/quran/hafs/text.json.gz must be decompressed at bundle time (aapt2 strips the .gz suffix)")

              # ٤) كل ما يشير إليه index.html موجود فعلًا.
              html = require("assets/www/index.html").decode("utf-8", "replace")
              referenced = sorted(set(re.findall(r'(?:src|href)="(/[^"]+\.(?:js|css|webmanifest|woff2?))"', html)))
              if not referenced:
                  fail("index.html references no built assets")
              for ref in referenced:
                  require("assets/www" + ref)
              print(f"index.html references verified: {len(referenced)} -> {', '.join(referenced)}")

              # ٥) كل مسار قرآني يطلبه JS المضفّر موجود داخل الحزمة.
              bundles = [n for n in names if n.startswith("assets/www/assets/") and n.endswith(".js")]
              if not bundles:
                  fail("No bundled JavaScript found in the APK")
              wanted = set()
              for path in bundles:
                  text = z.read(path).decode("utf-8", "replace")
                  for match in re.findall(r'(quran/[A-Za-z0-9_./-]+\.(?:json|json\.gz))', text):
                      wanted.add(match)
              if not wanted:
                  fail("No quran asset paths found in the bundled JavaScript")
              for rel in sorted(wanted):
                  # aapt2 ينشر الأصل المضغوط بلا لاحقة .gz، فنطلب الاسم المطابق فعلًا.
                  require("assets/www/" + (rel[:-3] if rel.endswith(".gz") else rel))
              print(f"JavaScript-referenced quran assets verified: {len(wanted)}")

              # ٦) أسطر المصحف: ٦١ ملفًا تغطي الصفحات ١–٦٠٤.
              lines = sorted(n for n in names if n.startswith("assets/www/quran/lines/") and n.endswith(".json"))
              if len(lines) != 61:
                  fail(f"Expected 61 quran line chunks, found {len(lines)}")
              covered = set()
              for path in lines:
                  base = os.path.basename(path)[:-5]
                  try:
                      first, last = base.split("-")
                      covered.update(range(int(first), int(last) + 1))
                  except ValueError:
                      fail(f"Malformed quran line chunk name: {base}")
              missing = [page for page in range(1, 605) if page not in covered]
              if missing:
                  fail(f"Quran line chunks do not cover pages: {missing[:10]}")
              print("Quran line chunks verified: 61 files covering pages 1-604")

              # ٧) بيان الأصول المضمَّنة: الحجم والبصمة لكل ملف.
              try:
                  manifest = json.loads(require("assets/offline/v1/manifest.json"))
              except json.JSONDecodeError as error:
                  fail(f"Unreadable offline manifest: {error}")
              assets = manifest.get("assets") or []
              if not assets:
                  fail("Offline manifest has no assets")
              labels = {a.get("label") for a in assets}
              for label in ("lite", "reference", "wasm", "wasm-loader"):
                  if label not in labels:
                      fail(f"Offline manifest is missing the {label!r} asset")
              for asset in assets:
                  path = "assets/offline/v1/" + asset["path"]
                  data = require(path)
                  digest = hashlib.sha256(data).hexdigest()
                  if len(data) != asset["bytes"] or digest != asset["sha256"]:
                      fail(f"Checksum mismatch for {path}: {len(data)} bytes/{digest} != {asset['bytes']} bytes/{asset['sha256']}")
                  print(f"OK {asset['label']:12} {len(data):>10} bytes {digest}")

          print("All bundled assets verified inside the APK (identity, references, line layout, checksums)")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thimar-apk
          path: /tmp/thimar-*.apk

  publish:
    needs: build
    # بوابة موافقة: بيئة production (GitHub Environments) تتطلب مراجعة يدوية،
    # ولا يُنشر أي إصدار دون موافقة صريحة (手動 approved=true أو push مع [release approved]).
    environment: production
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.event.inputs.approved == 'true') }}
    runs-on: ubuntu-latest
    env:
      METADATA_URL: https://thimar.freebuff.page/updates/android.json
      DEPLOY_BASE: https://thimar.freebuff.page
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: thimar-apk
          path: /tmp

      # الترتيب الصحيح: الميتاداتا تُبنى من مخرجات البناء ولا تُنشر قبل رفع الـAPK
      # والتحقق منه. لا مقارنة مع ملف المستودع القديم هنا إطلاقًا.
      - name: Render release metadata from the built APK
        env:
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          BUILD_SHA256: ${{ needs.build.outputs.sha256 }}
          BUILD_SIZE: ${{ needs.build.outputs.file_size }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          apk = os.path.join("/tmp", os.environ["APK_NAME"])
          if not os.path.isfile(apk):
              print("APK artifact not found:", apk, file=sys.stderr)
              sys.exit(1)
          size = os.path.getsize(apk)
          if size != int(os.environ["BUILD_SIZE"]):
              print(f"Artifact size {size} != build output {os.environ['BUILD_SIZE']}", file=sys.stderr)
              sys.exit(1)
          path = "public/updates/android.json"
          previous = {}
          try:
              previous = json.load(open(path))
          except Exception:
              previous = {}
          history = [e for e in (previous.get("versionHistory") or [])
                     if isinstance(e, dict) and e.get("versionName")]
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          history = [e for e in history if e.get("versionCode") != code]
          history.append({"versionName": name, "versionCode": code})
          history.sort(key=lambda e: int(e.get("versionCode") or 0))
          # Load structured release notes for this version (if provided).
          release_notes_entry = None
          try:
              rn_src = json.load(open("public/updates/release-notes.json"))
              for entry in rn_src.get("releases", []):
                  if int(entry.get("versionCode", -1)) == code:
                      release_notes_entry = entry
                      break
          except Exception as e:
              print("release-notes.json not found or invalid:", e)
          metadata = {
              "platform": "android",
              "packageName": "app.thimar.quran",
              "versionName": name,
              "versionCode": code,
              "minSupportedVersionCode": int(previous.get("minSupportedVersionCode") or 1),
              "available": True,
              "downloadUrl": "https://thimar.freebuff.page/assets/large/" + os.environ["APK_NAME"],
              "fileName": os.environ["APK_NAME"],
              "fileSize": size,
              "sha256": os.environ["BUILD_SHA256"],
              "versionHistory": history,
          }
          if release_notes_entry:
              metadata["releaseDate"] = release_notes_entry.get("releaseDate")
              metadata["shortDescription"] = release_notes_entry.get("shortDescription")
              metadata["releaseNotes"] = release_notes_entry.get("releaseNotes")
              print("Release notes attached for", name, code)
          else:
              print("WARNING: no release notes found for", name, code)
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print("Rendered release metadata for", name, code, "— not published yet")
          PY

      # يرفض أي إصدار لا يزيد versionCode على كل ما نُشر سابقًا (مع تجاهل هذا الإصدار
      # نفسه كي لا يفشل الفحص إذا نُشرت بياناته على الموقع قبل هذه المهمة).
      - name: Reject invalid or non-incrementing versionCode
        env:
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          built = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          if built < 1:
              print(f"Invalid versionCode: {built}", file=sys.stderr)
              sys.exit(1)
          if not name:
              print("Invalid versionName", file=sys.stderr)
              sys.exit(1)
          live = None
          try:
              request = urllib.request.Request(
                  "https://thimar.freebuff.page/updates/android.json",
                  headers={"User-Agent": "thimar-release-workflow"},
              )
              with urllib.request.urlopen(request, timeout=30) as r:
                  live = json.load(r)
              print("Compared against live production metadata")
          except Exception as error:
              # مصدر بديل: تاريخ الإصدارات المحفوظ في المستودع نفسه.
              print("Live production metadata unavailable (", error, ") — using repository history")
              live = json.load(open("public/updates/android.json"))
          others = []
          live_code = live.get("versionCode")
          if isinstance(live_code, int) and live_code != built:
              others.append(live_code)
          for entry in live.get("versionHistory") or []:
              code = entry.get("versionCode")
              if isinstance(code, int) and code != built:
                  others.append(code)
          highest = max(others, default=0)
          if built <= highest:
              print(
                  f"versionCode must increase: built {built} <= highest published {highest}",
                  file=sys.stderr,
              )
              sys.exit(1)
          history = {e.get("versionCode"): e.get("versionName") for e in live.get("versionHistory") or []}
          if built in history and history[built] not in (None, name):
              print(
                  f"versionCode {built} was already published as {history[built]!r}, not {name!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"versionCode {built} increases over the highest published {highest}")
          PY

      - name: Validate release metadata in repository
        run: |
          python3 - <<'PY'
          import json,sys
          data=json.load(open('public/updates/android.json'))
          required=['available','versionName','versionCode','downloadUrl','fileSize','sha256','packageName']
          missing=[k for k in required if k not in data or data.get(k) in (None,'')]
          if missing or data.get('available') is not True:
              print('Invalid or unpublished release metadata:', missing, file=sys.stderr)
              sys.exit(1)
          print('Valid release:', data['versionName'], data['versionCode'])
          PY

      - name: Validate release notes (Arabic + English)
        env:
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          BUILD_SIZE: ${{ needs.build.outputs.file_size }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open('public/updates/android.json'))
          code = int(os.environ['VERSION_CODE'])
          name = os.environ['VERSION_NAME']
          size = int(os.environ['BUILD_SIZE'])
          apk = os.environ['APK_NAME']
          # version match
          if data.get('versionCode') != code or data.get('versionName') != name:
              print('Release notes version mismatch', file=sys.stderr); sys.exit(1)
          # fileSize match
          if data.get('fileSize') != size:
              print(f"fileSize mismatch: {data.get('fileSize')} != {size}", file=sys.stderr); sys.exit(1)
          # downloadUrl points to published APK
          expected_url = 'https://thimar.freebuff.page/assets/large/' + apk
          if data.get('downloadUrl') != expected_url:
              print(f"downloadUrl mismatch: {data.get('downloadUrl')} != {expected_url}", file=sys.stderr); sys.exit(1)
          # release notes AR/EN
          rn = data.get('releaseNotes')
          if not isinstance(rn, dict):
              print('releaseNotes missing', file=sys.stderr); sys.exit(1)
          for lang in ('ar', 'en'):
              if lang not in rn:
                  print(f'missing language {lang} in releaseNotes', file=sys.stderr); sys.exit(1)
              block = rn[lang]
              if not isinstance(block, dict):
                  print(f'invalid block for {lang}', file=sys.stderr); sys.exit(1)
              for key in ('features', 'improvements', 'bugFixes', 'securityUpdates'):
                  if key not in block or not isinstance(block[key], list):
                      print(f'missing/invalid {key} for {lang}', file=sys.stderr); sys.exit(1)
          # shortDescription AR/EN
          sd = data.get('shortDescription')
          if not isinstance(sd, dict) or 'ar' not in sd or 'en' not in sd:
              print('shortDescription missing ar/en', file=sys.stderr); sys.exit(1)
          if not sd['ar'] or not sd['en']:
              print('shortDescription empty', file=sys.stderr); sys.exit(1)
          # releaseDate
          if not data.get('releaseDate'):
              print('releaseDate missing', file=sys.stderr); sys.exit(1)
          print('Release notes validated: AR/EN, size, URL for', name, code)
          PY

      - name: Upload APK to R2 (chunked)
        env:
          DEPLOY_TOKEN: ${{ secrets.THIMAR_DEPLOY_TOKEN }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          APK_PATH="/tmp/$APK_NAME"
          if [[ ! -f "$APK_PATH" ]]; then echo "APK not found: $APK_PATH" >&2; exit 1; fi
          TOK="$DEPLOY_TOKEN"
          if [[ -z "$TOK" ]]; then echo "THIMAR_DEPLOY_TOKEN required" >&2; exit 1; fi
          python3 - <<'PY'
          import json, os, urllib.request
          base = "https://thimar.freebuff.page"
          token = os.environ["DEPLOY_TOKEN"]
          name = os.environ["APK_NAME"]
          path = "/tmp/" + name
          chunk = 5 * 1024 * 1024
          def req(method, urlpath, data=None, headers=None):
              h = {"X-Deploy-Token": token, "User-Agent": "thimar-release-workflow"}
              if headers: h.update(headers)
              r = urllib.request.Request(base + urlpath, data=data, method=method, headers=h)
              with urllib.request.urlopen(r, timeout=300) as resp:
                  return json.loads(resp.read())
          init = req("POST", f"/api/admin/upload-large/init?name={name}")
          upload_id = init["uploadId"]
          parts = []
          part_number = 1
          with open(path, "rb") as f:
              while True:
                  chunk_data = f.read(chunk)
                  if not chunk_data: break
                  r = req("PUT", f"/api/admin/upload-large/part?name={name}&uploadId={upload_id}&partNumber={part_number}", data=chunk_data, headers={"Content-Type": "application/octet-stream"})
                  parts.append({"partNumber": r["partNumber"], "etag": r["etag"]})
                  print(f"part {part_number} uploaded ({len(chunk_data)} bytes)")
                  part_number += 1
          req("POST", f"/api/admin/upload-large/complete?name={name}&uploadId={upload_id}", data=json.dumps({"parts": parts}).encode(), headers={"Content-Type": "application/json"})
          print("Upload complete:", name)
          PY

      - name: Verify uploaded APK
        env:
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.file_size }}
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, sys
          name = "${{ env.APK_NAME }}"
          url = f"https://thimar.freebuff.page/assets/large/{name}"
          with urllib.request.urlopen(url, timeout=120) as r:
              data = r.read()
              size = int(r.headers.get('Content-Length', '0'))
              ct = r.headers.get('Content-Type', '')
          sha = hashlib.sha256(data).hexdigest()
          if sha != "${{ env.EXPECTED_SHA256 }}":
              print(f"SHA-256 mismatch: {sha} != ${{ env.EXPECTED_SHA256 }}", file=sys.stderr); sys.exit(1)
          if size != int("${{ env.EXPECTED_SIZE }}"):
              print(f"Size mismatch: {size} != ${{ env.EXPECTED_SIZE }}", file=sys.stderr); sys.exit(1)
          print(f"Verified: {name} sha256={sha} size={size}")
          PY

      - name: Publish release metadata (only after verified upload)
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- public/updates/android.json; then
            git config user.name "thimar-release-bot"
            git config user.email "release-bot@users.noreply.github.com"
            git add public/updates/android.json
            git commit -m "chore(release): publish android ${VERSION_NAME} (${VERSION_CODE}) [skip release]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Metadata commit pushed — the site deploy makes it live."
          else
            echo "Metadata already up to date; nothing to publish."
          fi

      - name: Wait for production metadata and APK publication
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request, sys
          expected = json.load(open('public/updates/android.json'))
          metadata_url = 'https://thimar.freebuff.page/updates/android.json'
          apk_url = expected['downloadUrl']
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(metadata_url, timeout=20) as response:
                      live = json.load(response)
                  if live != expected:
                      print(f'Attempt {attempt}: production metadata differs from repository')
                      time.sleep(10); continue
                  if not live.get('available'):
                      print(f'Attempt {attempt}: release not marked available')
                      time.sleep(10); continue
                  with urllib.request.urlopen(apk_url, timeout=120) as response:
                      content_type = response.headers.get('Content-Type', '')
                      size = int(response.headers.get('Content-Length', '0'))
                      sha256 = hashlib.sha256(response.read()).hexdigest()
                  if size != int(expected['fileSize']):
                      print(f'Attempt {attempt}: APK size mismatch ({size} != {expected["fileSize"]})')
                      time.sleep(10); continue
                  if sha256 != expected['sha256']:
                      print(f'Attempt {attempt}: APK SHA-256 mismatch')
                      time.sleep(10); continue
                  print('Production metadata and APK verified:', live['versionName'], live['versionCode'])
                  sys.exit(0)
              except Exception as error:
                  print(f'Attempt {attempt}: {error}')
                  time.sleep(10)
          print('Production release did not become available in time', file=sys.stderr)
          sys.exit(1)
          PY

      - name: Remove obsolete production APKs from R2
        env:
          DEPLOY_TOKEN: ${{ secrets.THIMAR_DEPLOY_TOKEN }}
          PREVIOUS_APK: ${{ github.event.inputs.previous_apk }}
        run: bash scripts/cleanup-old-android-releases.sh

      - name: Trigger update notification
        env:
          THIMAR_PUSH_SECRET: ${{ secrets.THIMAR_PUSH_SECRET }}
          SUPABASE_FUNCTION_URL: https://jbsvmpiwdwowizzfzlqr.supabase.co/functions/v1/send-update-notification
          METADATA_URL: https://thimar.freebuff.page/updates/android.json
        run: bash scripts/publish-android-update.sh
